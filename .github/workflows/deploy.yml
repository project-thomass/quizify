name: Deploy to GitHub Pages

on:
  push:
    branches: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Menggunakan Node 18 yang lebih stabil untuk framework bawaan figma

      - name: Install pnpm
        uses: pnpm/action-setup@v2 # Menggunakan versi v2 yang kompatibilitasnya lebih luas
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile # Bypass pengecekan pnpm-lock.yaml yang ketat

      - name: Build Project
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
